<style>
  body { background:#04140d; color:#ede8df; font-family:'DM Mono',monospace; font-size:13px; padding:24px; line-height:1.6; }
  h1 { font-family:Georgia,serif; color:#c9a84c; font-size:20px; margin-bottom:4px; }

  .summary.fail { background:rgba(224,112,112,.12); color:#e07070; border:1px solid rgba(224,112,112,.4); }

<body>
<h1>Dhanam — Calculation Test Results</h1>
<div class="sub">Runs the same assertions as <code>tests.js</code>, in-browser, against the same <code>calc.js</code> the app loads. See TASK-TEST-HARNESS.md.</div>
<div id="summary" class="summary">Running…</div>
<div id="results"></div>

<script src="calc.js"></script>
<script>
let pass = 0, fail = 0;
const rows = [];

function ok(name, condition, detail) {
  if (condition) pass++; else fail++;
  rows.push({ name, condition, detail });
}
function approxEqual(a, b, tolerance) { return Math.abs(a - b) <= tolerance; }

function referenceEMIByBisection(P, annualRate, years) {
  const r = annualRate / 12 / 100;
  const n = years * 12;
  if (r === 0) return P / n;
  function balanceAfter(emi) {
    let bal = P;
    for (let i = 0; i < n; i++) bal = bal + bal * r - emi;
    return bal;
  }
  let lo = P / n, hi = P;
  for (let iter = 0; iter < 200; iter++) {
    const mid = (lo + hi) / 2;
    if (balanceAfter(mid) > 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

// calcEMI
ok('calcEMI: zero-rate branch is exact', calcEMI(1200000, 0, 10) === 1200000 / 120, `got ${calcEMI(1200000, 0, 10)}`);
{
  const emi = calcEMI(1000000, 10, 1);
  const reference = referenceEMIByBisection(1000000, 10, 1);
  ok('calcEMI: matches independent bisection oracle (P=10L, 10%, 1yr)', approxEqual(emi, reference, 1), `calcEMI=${emi.toFixed(2)} vs oracle=${reference.toFixed(2)}`);
}
{
  const emi = calcEMI(5000000, 8.75, 20);
  const reference = referenceEMIByBisection(5000000, 8.75, 20);
  ok('calcEMI: matches independent bisection oracle (P=50L, 8.75%, 20yr)', approxEqual(emi, reference, 1), `calcEMI=${emi.toFixed(2)} vs oracle=${reference.toFixed(2)}`);
}
ok('calcEMI: monotonically decreasing as tenure increases',
  calcEMI(5000000, 9, 15) > calcEMI(5000000, 9, 20) && calcEMI(5000000, 9, 20) > calcEMI(5000000, 9, 30));

// loanAtYear
{
  const P = 5000000, rate = 8.75, years = 20;
  const atEnd = loanAtYear(P, rate, years, years);
  ok('loanAtYear: balance ~0 at full tenure', approxEqual(atEnd.balance, 0, 1), `balance=${atEnd.balance.toFixed(2)}`);
  ok('loanAtYear: principalPaid ~P at full tenure', approxEqual(atEnd.principalPaid, P, 1));
  const atStart = loanAtYear(P, rate, years, 0);
  ok('loanAtYear: balance ~P at year 0', approxEqual(atStart.balance, P, 1));
  ok('loanAtYear: principalPaid ~0 at year 0', approxEqual(atStart.principalPaid, 0, 1));
  ok('loanAtYear: interestPaid ~0 at year 0', approxEqual(atStart.interestPaid, 0, 1));
  const atMid = loanAtYear(P, rate, years, 10);
  ok('loanAtYear: principalPaid + balance == P at year 10', approxEqual(atMid.principalPaid + atMid.balance, P, 0.01));
}

// simulateLoan
{
  const P = 5000000, rate = 8.75, years = 20;
  const normal = simulateLoan(P, rate, years, 0, 0);
  ok('simulateLoan: no-extra case runs full tenure', approxEqual(normal.actualMonths, years * 12, 0));
  ok('simulateLoan: no-extra monthsSaved is 0', normal.monthsSaved === 0);
  const expectedInterest = calcEMI(P, rate, years) * years * 12 - P;
  ok('simulateLoan: no-extra totalInterest matches calcEMI*n - P', approxEqual(normal.totalInterest, expectedInterest, 1));
  const withExtra = simulateLoan(P, rate, years, 1, 0);
  ok('simulateLoan: extra EMI/year reduces tenure', withExtra.actualMonths < normal.actualMonths);
  ok('simulateLoan: extra EMI/year reduces total interest', withExtra.totalInterest < normal.totalInterest);
  const bigLumpsum = simulateLoan(P, rate, years, 0, P);
  ok('simulateLoan: lumpsum == P pays off within ~2 years', bigLumpsum.actualMonths <= 24);
}

// calcSIP
ok('calcSIP: zero-rate branch is exact', calcSIP(10000, 0, 10) === 10000 * 120);
ok('calcSIP: zero contribution gives zero corpus', calcSIP(0, 12, 20) === 0);
ok('calcSIP: monotonically increasing in years', calcSIP(10000, 12, 10) < calcSIP(10000, 12, 20));
ok('calcSIP: monotonically increasing in cagr', calcSIP(10000, 9, 20) < calcSIP(10000, 15, 20));

// calcStepupSIP cross-check (see tests.js for the full explanation of this finding)
{
  const flat = calcSIP(10000, 12, 20);
  const stepupAtZero = calcStepupSIP(10000, 0, 12, 20).corpus;
  const diffPct = ((flat - stepupAtZero) / flat) * 100;
  ok(`calcStepupSIP @ 0% step-up vs calcSIP: differ by ${diffPct.toFixed(2)}% (annuity-due vs ordinary-annuity timing — known finding, not a gross bug)`, Math.abs(diffPct) < 5, `flat=${flat.toFixed(0)} stepupAt0=${stepupAtZero.toFixed(0)}`);
}
ok('calcStepupSIP: 0% step-up final SIP equals starting SIP', approxEqual(calcStepupSIP(10000, 0, 12, 20).finalSIP, 10000, 0.01));
ok('calcStepupSIP: step-up produces more corpus than flat at same inputs', calcStepupSIP(10000, 10, 12, 20).corpus > calcStepupSIP(10000, 0, 12, 20).corpus);

// calcIncomeTax
ok('calcIncomeTax: zero income -> zero tax (new)', calcIncomeTax(0, 'new') === 0);
ok('calcIncomeTax: negative income -> zero tax (new)', calcIncomeTax(-100000, 'new') === 0);
ok('calcIncomeTax: new regime, taxable=15L -> exact 109200', approxEqual(calcIncomeTax(1500000, 'new'), 109200, 0.01), `got ${calcIncomeTax(1500000,'new')}`);
ok('calcIncomeTax: old regime, taxable=10L -> exact 117000', approxEqual(calcIncomeTax(1000000, 'old'), 117000, 0.01), `got ${calcIncomeTax(1000000,'old')}`);
ok('calcIncomeTax: new regime 87A cliff at 12L -> 0', calcIncomeTax(1200000, 'new') === 0);
ok('calcIncomeTax: new regime just above 87A cliff -> tax > 0', calcIncomeTax(1200001, 'new') > 0);
ok('calcIncomeTax: old regime 87A cliff at 5L -> 0', calcIncomeTax(500000, 'old') === 0);
ok('calcIncomeTax: old regime just above 87A cliff -> tax > 0', calcIncomeTax(500001, 'old') > 0);

// Section 87A marginal relief, new regime only (R34 / D14) — tax before cess is
// capped at (taxable − 12L) until slab tax falls back below it at 12,70,588.24.
const MARGINAL_RELIEF_BREAKEVEN = 1200000 + 60000 / 0.85;
ok('calcIncomeTax: 87A relief at 12,00,001 -> excess + cess (1.04), not slab tax', approxEqual(calcIncomeTax(1200001, 'new'), 1.04, 0.01), `got ${calcIncomeTax(1200001,'new')}`);
ok('calcIncomeTax: 87A relief at 12,10,000 -> 10400 (naive slab would be 63960)', approxEqual(calcIncomeTax(1210000, 'new'), 10400, 0.01), `got ${calcIncomeTax(1210000,'new')}`);
ok('calcIncomeTax: 87A relief exactly ties slab tax at the ~12,70,588 breakeven', approxEqual(calcIncomeTax(MARGINAL_RELIEF_BREAKEVEN, 'new'), (MARGINAL_RELIEF_BREAKEVEN - 1200000) * 1.04, 0.01), `got ${calcIncomeTax(MARGINAL_RELIEF_BREAKEVEN,'new')}`);
ok('calcIncomeTax: above the breakeven (13L) -> full slab tax 78000, relief no longer binds', approxEqual(calcIncomeTax(1300000, 'new'), 78000, 0.01), `got ${calcIncomeTax(1300000,'new')}`);
{
  let cliffFound = null;
  for (let t = 1195000; t <= 1300000; t += 1000) {
    if (calcIncomeTax(t + 1000, 'new') - calcIncomeTax(t, 'new') > 1000 * 1.04 + 0.01) { cliffFound = t; break; }
  }
  ok('calcIncomeTax: no cliff across the 87A band — tax never rises faster than income', cliffFound === null, cliffFound === null ? '' : `jump at taxable=${cliffFound}`);
}
// Old regime has no marginal-relief provision — its cliff is real law, not a bug.
ok('calcIncomeTax: old regime cliff untouched by the new-regime relief fix', approxEqual(calcIncomeTax(500001, 'old'), 12500.2 * 1.04, 0.01), `got ${calcIncomeTax(500001,'old')}`);

// calcPerquisite — Income-tax Rules 2026, in force 2026-04-01 (R37 / D15).
// These pin current statutory values; a failure means the constants moved.
ok('calcPerquisite: <=1.6L or EV, no driver -> 5000', calcPerquisite(false, false) === 5000, `got ${calcPerquisite(false,false)}`);
ok('calcPerquisite: >1.6L, no driver -> 7000', calcPerquisite(true, false) === 7000, `got ${calcPerquisite(true,false)}`);
ok('calcPerquisite: <=1.6L or EV, with driver -> 8000', calcPerquisite(false, true) === 8000, `got ${calcPerquisite(false,true)}`);
ok('calcPerquisite: >1.6L, with driver -> 10000', calcPerquisite(true, true) === 10000, `got ${calcPerquisite(true,true)}`);
ok('calcPerquisite: chauffeur add-on is a flat 3000, independent of engine size',
  calcPerquisite(false, true) - calcPerquisite(false, false) === 3000 &&
  calcPerquisite(true, true) - calcPerquisite(true, false) === 3000);
ok('calcPerquisite: no pre-2026 value (1800/2400/900/2700/3300) is still returned',
  ![1800, 2400, 900, 2700, 3300].some(stale =>
    [calcPerquisite(false,false), calcPerquisite(true,false),
     calcPerquisite(false,true), calcPerquisite(true,true)].includes(stale)));

// calcCarDepreciation
ok('calcCarDepreciation: year 1 is exactly 80% of price', calcCarDepreciation(1000000, 1) === 1000000 * 0.80);
ok('calcCarDepreciation: year 2 is exactly 80%*85% of price', approxEqual(calcCarDepreciation(1000000, 2), 1000000 * 0.80 * 0.85, 0.0001));
ok('calcCarDepreciation: monotonically decreasing in years', calcCarDepreciation(1000000, 1) > calcCarDepreciation(1000000, 3) && calcCarDepreciation(1000000, 3) > calcCarDepreciation(1000000, 5));
ok('calcCarDepreciation: zero price -> zero resale', calcCarDepreciation(0, 5) === 0);

// calcOwnershipCost / calcOwnershipCurve (Phase 13's R49, generalised across
// lease/loan/cash by Phase 14/R55) — mirrors tests.js's block. Reference
// case (₹20L ICE, 10% residual, 10% rate, 4yr, app defaults): endpoint
// 2406795.0641, gap 1424195.0641.
{
  const base = {
    mode: 'lease',
    price: 2000000, annualRate: 10, residualPct: 0.10, years: 4,
    hasDriver: false, marginalRate: 0.312, bigEngine: false,
    type: 'ICE', efficiency: 15,
    cityKm: 8000, hwyKm: 4000, petrolPrice: 117, iceHwyMult: 1.35,
    homeRate: 8, publicRate: 20, evHwyMult: 1.15,
    maintAnnual: 9000, insRate: 0.03, depRate: 0.15,
  };
  const curve = calcOwnershipCurve(base);
  const net = calcOwnershipCost(base);
  const last = curve.years.length - 1;

  ok('calcOwnershipCurve: reference case endpoint pins to 2406795.0641', approxEqual(curve.cumulativeCost[last], 2406795.0641, 0.01), `got ${curve.cumulativeCost[last].toFixed(4)}`);
  ok('calcOwnershipCurve: reference case gap pins to 1424195.0641', approxEqual(curve.cumulativeCost[last] - curve.carValue[last], 1424195.0641, 0.01), `got ${(curve.cumulativeCost[last] - curve.carValue[last]).toFixed(4)}`);
  ok("calcOwnershipCurve: cumulativeCost[N-1] === calcOwnershipCost netCost", approxEqual(curve.cumulativeCost[last], net.netCost, 0.01), `curve=${curve.cumulativeCost[last].toFixed(4)} netCost=${net.netCost.toFixed(4)}`);
  ok("calcOwnershipCurve: cumulativeCost[N-1] - carValue[N-1] === netCostAfterResale", approxEqual(curve.cumulativeCost[last] - curve.carValue[last], net.netCostAfterResale, 0.01), `gap=${(curve.cumulativeCost[last]-curve.carValue[last]).toFixed(4)} netCostAfterResale=${net.netCostAfterResale.toFixed(4)}`);

  // Guards against the EMI being recomputed per-year at a shorter tenure
  // instead of accumulated at the full-term value — invisible at the
  // endpoint, so pinned at an intermediate year instead.
  ok('calcOwnershipCurve: year-2 point is the full-term EMI accumulated, not a 2-year lease repriced', approxEqual(curve.cumulativeCost[1], 1118798.7828, 0.01), `got ${curve.cumulativeCost[1].toFixed(4)}`);
  const repricedYear2 = calcOwnershipCost({ ...base, years: 2 }).netCost;
  ok('calcOwnershipCurve: year-2 point must NOT equal a 2-year-tenure calcOwnershipCost', !approxEqual(curve.cumulativeCost[1], repricedYear2, 0.01), `curve[1]=${curve.cumulativeCost[1].toFixed(4)} 2yr-repriced=${repricedYear2.toFixed(4)}`);

  let costRising = true, valueFalling = true;
  for (let i = 1; i < curve.years.length; i++) {
    if (curve.cumulativeCost[i] <= curve.cumulativeCost[i-1]) costRising = false;
    if (curve.carValue[i] >= curve.carValue[i-1]) valueFalling = false;
  }
  ok('calcOwnershipCurve: cumulativeCost is strictly rising year over year', costRising, `values=${curve.cumulativeCost.map(v=>v.toFixed(0))}`);
  ok('calcOwnershipCurve: carValue is strictly falling year over year', valueFalling, `values=${curve.carValue.map(v=>v.toFixed(0))}`);

  const single = calcOwnershipCurve({ ...base, years: 1 });
  const singleNet = calcOwnershipCost({ ...base, years: 1 });
  ok('calcOwnershipCurve: N=1 produces exactly one point', single.years.length === 1 && single.cumulativeCost.length === 1 && single.carValue.length === 1, `years.length=${single.years.length}`);
  ok('calcOwnershipCurve: N=1 endpoint still matches calcOwnershipCost at the same tenure', approxEqual(single.cumulativeCost[0], singleNet.netCost, 0.01), `curve=${single.cumulativeCost[0].toFixed(4)} netCost=${singleNet.netCost.toFixed(4)}`);
  ok('calcOwnershipCurve: N=1 values are finite (no NaN/Infinity)', isFinite(single.cumulativeCost[0]) && isFinite(single.carValue[0]));

  const zeroRate = calcOwnershipCurve({ ...base, annualRate: 0 });
  const zeroRateNet = calcOwnershipCost({ ...base, annualRate: 0 });
  ok('calcOwnershipCurve: zero-rate case is finite throughout', zeroRate.cumulativeCost.every(isFinite) && zeroRate.carValue.every(isFinite), `cumulativeCost=${zeroRate.cumulativeCost}`);
  ok('calcOwnershipCurve: zero-rate case endpoint still matches calcOwnershipCost', approxEqual(zeroRate.cumulativeCost[zeroRate.years.length-1], zeroRateNet.netCost, 0.01), `curve=${zeroRate.cumulativeCost[zeroRate.years.length-1].toFixed(4)} netCost=${zeroRateNet.netCost.toFixed(4)}`);

  // ── Loan/cash modes (Phase 14, R55) ──────────────────────────────────
  const loanBase = { ...base, mode: 'loan', downPayment: 300000 };
  const loanCurve = calcOwnershipCurve(loanBase);
  const loanNet = calcOwnershipCost(loanBase);
  ok('calcOwnershipCurve (loan mode): endpoint equals calcOwnershipCost netCost', approxEqual(loanCurve.cumulativeCost[loanCurve.years.length - 1], loanNet.netCost, 0.01), `curve=${loanCurve.cumulativeCost[loanCurve.years.length-1].toFixed(4)} netCost=${loanNet.netCost.toFixed(4)}`);
  ok('calcOwnershipCurve (loan mode): year-2 point is the full-term EMI accumulated, not a 2-year loan repriced', approxEqual(loanCurve.cumulativeCost[1], 1634815.6264, 0.01), `got ${loanCurve.cumulativeCost[1].toFixed(4)}`);
  const loanRepricedYear2 = calcOwnershipCost({ ...loanBase, years: 2 }).netCost;
  ok('calcOwnershipCurve (loan mode): year-2 point must NOT equal a 2-year-tenure calcOwnershipCost', !approxEqual(loanCurve.cumulativeCost[1], loanRepricedYear2, 0.01), `curve[1]=${loanCurve.cumulativeCost[1].toFixed(4)} 2yr-repriced=${loanRepricedYear2.toFixed(4)}`);

  const cashBase = { ...base, mode: 'cash' };
  const cashCurve = calcOwnershipCurve(cashBase);
  const cashNet = calcOwnershipCost(cashBase);
  ok('calcOwnershipCurve (cash mode): endpoint equals calcOwnershipCost netCost', approxEqual(cashCurve.cumulativeCost[cashCurve.years.length - 1], cashNet.netCost, 0.01), `curve=${cashCurve.cumulativeCost[cashCurve.years.length-1].toFixed(4)} netCost=${cashNet.netCost.toFixed(4)}`);

  const leaseZeroResidual = calcOwnershipCost({ ...base, mode: 'lease', residualPct: 0 });
  const loanZeroDown = calcOwnershipCost({ ...base, mode: 'loan', downPayment: 0 });
  ok('calcOwnershipCost: residual=0 lease and downPayment=0 loan produce IDENTICAL EMIs', leaseZeroResidual.emi === loanZeroDown.emi, `lease=${leaseZeroResidual.emi} loan=${loanZeroDown.emi}`);

  ok('calcLumpsumGrowth: matches P*(1+cagr/100)^years', approxEqual(calcLumpsumGrowth(1000000, 12, 5), 1000000 * Math.pow(1.12, 5), 0.01), `got ${calcLumpsumGrowth(1000000, 12, 5)}`);
}

// calcNetWorthProjection (Phase 16/R65) — extracted verbatim out of
// renderWorthProjection()'s inline closure so that function and the loan
// panel's reverse Worth bridge (renderAdvWorthBridge()) call one shared
// formula instead of two hand-copied ones.
{
  ok('calcNetWorthProjection: all-zero inputs at year 0 -> 0',
    calcNetWorthProjection(0, 0, 0, 10, 9, 10, 0, 0) === 0,
    `got ${calcNetWorthProjection(0, 0, 0, 10, 9, 10, 0, 0)}`);

  ok('calcNetWorthProjection: year 0 with no SIP contribution reduces to investable + property - liabilities exactly',
    calcNetWorthProjection(100000, 500000, 200000, 10, 9, 10, 0, 0) === 400000,
    `got ${calcNetWorthProjection(100000, 500000, 200000, 10, 9, 10, 0, 0)}`);

  const investable = 100000, propertyVal = 0, liabilities = 120000;
  const monthlySip = 10000, years = 5, debtYears = 10;
  const expected = investable
    + calcSIP(monthlySip, 0, years)
    + propertyVal
    - loanAtYear(liabilities, 0, debtYears, years).balance;
  ok('calcNetWorthProjection: 0% cagr/0% debt-rate case matches calcSIP + loanAtYear composed independently',
    calcNetWorthProjection(investable, propertyVal, liabilities, 0, 0, debtYears, monthlySip, years) === expected,
    `got ${calcNetWorthProjection(investable, propertyVal, liabilities, 0, 0, debtYears, monthlySip, years)} expected ${expected}`);

  ok('calcNetWorthProjection: property is held flat — with investable/liabilities/SIP all 0, the result equals propertyVal unchanged at any horizon',
    calcNetWorthProjection(0, 750000, 0, 12, 9, 10, 0, 20) === 750000,
    `got ${calcNetWorthProjection(0, 750000, 0, 12, 9, 10, 0, 20)}`);

  const debtPaidResult = calcNetWorthProjection(200000, 0, 500000, 10, 9, 5, 0, 5);
  const expectedGrown = 200000 * Math.pow(1.10, 5);
  ok('calcNetWorthProjection: debt fully paid off by the horizon leaves only the grown investable amount (no negative liability)',
    approxEqual(debtPaidResult, expectedGrown, 0.01),
    `got ${debtPaidResult} expected ${expectedGrown}`);
}

// Render
const summaryEl = document.getElementById('summary');
const resultsEl = document.getElementById('results');
summaryEl.textContent = `${pass} passed, ${fail} failed (${pass + fail} total)`;
summaryEl.className = 'summary ' + (fail === 0 ? 'pass' : 'fail');
resultsEl.innerHTML = rows.map(r =>
  `<div class="row ${r.condition ? 'ok' : 'bad'}">${r.condition ? '✓' : '✗'} ${r.name}${r.detail ? `<div class="detail">${r.detail}</div>` : ''}</div>`
).join('');
</script>
</body>
</html>
