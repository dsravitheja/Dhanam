<h1>Dhanam — Calculation Test Results</h1>
<div class="sub">Runs the same assertions as <code>tests.js</code>, in-browser, against the same <code>calc.js</code> the app loads. See TASK-TEST-HARNESS.md.</div>

<script src="calc.js"></script>
<script>
let pass = 0, fail = 0;
const rows = [];

function ok(name, condition, detail) {
  if (condition) pass++; else fail++;
  rows.push({ name, condition, detail });
}
function approxEqual(a, b, tolerance) { return Math.abs(a - b) <= tolerance; }

function referenceEMIByBisection(P, annualRate, years) {
  const r = annualRate / 12 / 100;
  const n = years * 12;
  if (r === 0) return P / n;
  function balanceAfter(emi) {
    let bal = P;
    for (let i = 0; i < n; i++) bal = bal + bal * r - emi;
    return bal;
  }
  let lo = P / n, hi = P;
  for (let iter = 0; iter < 200; iter++) {
    const mid = (lo + hi) / 2;
    if (balanceAfter(mid) > 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

// calcEMI
ok('calcEMI: zero-rate branch is exact', calcEMI(1200000, 0, 10) === 1200000 / 120, `got ${calcEMI(1200000, 0, 10)}`);
{
  const emi = calcEMI(1000000, 10, 1);
  const reference = referenceEMIByBisection(1000000, 10, 1);
  ok('calcEMI: matches independent bisection oracle (P=10L, 10%, 1yr)', approxEqual(emi, reference, 1), `calcEMI=${emi.toFixed(2)} vs oracle=${reference.toFixed(2)}`);
}
{
  const emi = calcEMI(5000000, 8.75, 20);
  const reference = referenceEMIByBisection(5000000, 8.75, 20);
  ok('calcEMI: matches independent bisection oracle (P=50L, 8.75%, 20yr)', approxEqual(emi, reference, 1), `calcEMI=${emi.toFixed(2)} vs oracle=${reference.toFixed(2)}`);
}
ok('calcEMI: monotonically decreasing as tenure increases',
  calcEMI(5000000, 9, 15) > calcEMI(5000000, 9, 20) && calcEMI(5000000, 9, 20) > calcEMI(5000000, 9, 30));

// loanAtYear
{
  const P = 5000000, rate = 8.75, years = 20;
  const atEnd = loanAtYear(P, rate, years, years);
  ok('loanAtYear: balance ~0 at full tenure', approxEqual(atEnd.balance, 0, 1), `balance=${atEnd.balance.toFixed(2)}`);
  ok('loanAtYear: principalPaid ~P at full tenure', approxEqual(atEnd.principalPaid, P, 1));
  const atStart = loanAtYear(P, rate, years, 0);
  ok('loanAtYear: balance ~P at year 0', approxEqual(atStart.balance, P, 1));
  ok('loanAtYear: principalPaid ~0 at year 0', approxEqual(atStart.principalPaid, 0, 1));
  ok('loanAtYear: interestPaid ~0 at year 0', approxEqual(atStart.interestPaid, 0, 1));
  const atMid = loanAtYear(P, rate, years, 10);
  ok('loanAtYear: principalPaid + balance == P at year 10', approxEqual(atMid.principalPaid + atMid.balance, P, 0.01));
}

// simulateLoan
{
  const P = 5000000, rate = 8.75, years = 20;
  const normal = simulateLoan(P, rate, years, 0, 0);
  ok('simulateLoan: no-extra case runs full tenure', approxEqual(normal.actualMonths, years * 12, 0));
  ok('simulateLoan: no-extra monthsSaved is 0', normal.monthsSaved === 0);
  const expectedInterest = calcEMI(P, rate, years) * years * 12 - P;
  ok('simulateLoan: no-extra totalInterest matches calcEMI*n - P', approxEqual(normal.totalInterest, expectedInterest, 1));
  const withExtra = simulateLoan(P, rate, years, 1, 0);
  ok('simulateLoan: extra EMI/year reduces tenure', withExtra.actualMonths < normal.actualMonths);
  ok('simulateLoan: extra EMI/year reduces total interest', withExtra.totalInterest < normal.totalInterest);
  const bigLumpsum = simulateLoan(P, rate, years, 0, P);
  ok('simulateLoan: lumpsum == P pays off within ~2 years', bigLumpsum.actualMonths <= 24);
}

// calcSIP
ok('calcSIP: zero-rate branch is exact', calcSIP(10000, 0, 10) === 10000 * 120);
ok('calcSIP: zero contribution gives zero corpus', calcSIP(0, 12, 20) === 0);
ok('calcSIP: monotonically increasing in years', calcSIP(10000, 12, 10) < calcSIP(10000, 12, 20));
ok('calcSIP: monotonically increasing in cagr', calcSIP(10000, 9, 20) < calcSIP(10000, 15, 20));

// calcStepupSIP cross-check (see tests.js for the full explanation of this finding)
{
  const flat = calcSIP(10000, 12, 20);
  const stepupAtZero = calcStepupSIP(10000, 0, 12, 20).corpus;
  const diffPct = ((flat - stepupAtZero) / flat) * 100;
  ok(`calcStepupSIP @ 0% step-up vs calcSIP: differ by ${diffPct.toFixed(2)}% (annuity-due vs ordinary-annuity timing — known finding, not a gross bug)`, Math.abs(diffPct) < 5, `flat=${flat.toFixed(0)} stepupAt0=${stepupAtZero.toFixed(0)}`);
}
ok('calcStepupSIP: 0% step-up final SIP equals starting SIP', approxEqual(calcStepupSIP(10000, 0, 12, 20).finalSIP, 10000, 0.01));
ok('calcStepupSIP: step-up produces more corpus than flat at same inputs', calcStepupSIP(10000, 10, 12, 20).corpus > calcStepupSIP(10000, 0, 12, 20).corpus);

// calcIncomeTax
ok('calcIncomeTax: zero income -> zero tax (new)', calcIncomeTax(0, 'new') === 0);
ok('calcIncomeTax: negative income -> zero tax (new)', calcIncomeTax(-100000, 'new') === 0);
ok('calcIncomeTax: new regime, taxable=15L -> exact 109200', approxEqual(calcIncomeTax(1500000, 'new'), 109200, 0.01), `got ${calcIncomeTax(1500000,'new')}`);
ok('calcIncomeTax: old regime, taxable=10L -> exact 117000', approxEqual(calcIncomeTax(1000000, 'old'), 117000, 0.01), `got ${calcIncomeTax(1000000,'old')}`);
ok('calcIncomeTax: new regime 87A cliff at 12L -> 0', calcIncomeTax(1200000, 'new') === 0);
ok('calcIncomeTax: new regime just above 87A cliff -> tax > 0', calcIncomeTax(1200001, 'new') > 0);
ok('calcIncomeTax: old regime 87A cliff at 5L -> 0', calcIncomeTax(500000, 'old') === 0);
ok('calcIncomeTax: old regime just above 87A cliff -> tax > 0', calcIncomeTax(500001, 'old') > 0);

// Section 87A marginal relief, new regime only (R34 / D14) — tax before cess is
// capped at (taxable − 12L) until slab tax falls back below it at 12,70,588.24.
const MARGINAL_RELIEF_BREAKEVEN = 1200000 + 60000 / 0.85;
ok('calcIncomeTax: 87A relief at 12,00,001 -> excess + cess (1.04), not slab tax', approxEqual(calcIncomeTax(1200001, 'new'), 1.04, 0.01), `got ${calcIncomeTax(1200001,'new')}`);
ok('calcIncomeTax: 87A relief at 12,10,000 -> 10400 (naive slab would be 63960)', approxEqual(calcIncomeTax(1210000, 'new'), 10400, 0.01), `got ${calcIncomeTax(1210000,'new')}`);
ok('calcIncomeTax: 87A relief exactly ties slab tax at the ~12,70,588 breakeven', approxEqual(calcIncomeTax(MARGINAL_RELIEF_BREAKEVEN, 'new'), (MARGINAL_RELIEF_BREAKEVEN - 1200000) * 1.04, 0.01), `got ${calcIncomeTax(MARGINAL_RELIEF_BREAKEVEN,'new')}`);
ok('calcIncomeTax: above the breakeven (13L) -> full slab tax 78000, relief no longer binds', approxEqual(calcIncomeTax(1300000, 'new'), 78000, 0.01), `got ${calcIncomeTax(1300000,'new')}`);
{
  let cliffFound = null;
  for (let t = 1195000; t <= 1300000; t += 1000) {
    if (calcIncomeTax(t + 1000, 'new') - calcIncomeTax(t, 'new') > 1000 * 1.04 + 0.01) { cliffFound = t; break; }
  }
  ok('calcIncomeTax: no cliff across the 87A band — tax never rises faster than income', cliffFound === null, cliffFound === null ? '' : `jump at taxable=${cliffFound}`);
}
// Old regime has no marginal-relief provision — its cliff is real law, not a bug.
ok('calcIncomeTax: old regime cliff untouched by the new-regime relief fix', approxEqual(calcIncomeTax(500001, 'old'), 12500.2 * 1.04, 0.01), `got ${calcIncomeTax(500001,'old')}`);

// calcPerquisite — Income-tax Rules 2026, in force 2026-04-01 (R37 / D15).
// These pin current statutory values; a failure means the constants moved.
ok('calcPerquisite: <=1.6L or EV, no driver -> 5000', calcPerquisite(false, false) === 5000, `got ${calcPerquisite(false,false)}`);
ok('calcPerquisite: >1.6L, no driver -> 7000', calcPerquisite(true, false) === 7000, `got ${calcPerquisite(true,false)}`);
ok('calcPerquisite: <=1.6L or EV, with driver -> 8000', calcPerquisite(false, true) === 8000, `got ${calcPerquisite(false,true)}`);
ok('calcPerquisite: >1.6L, with driver -> 10000', calcPerquisite(true, true) === 10000, `got ${calcPerquisite(true,true)}`);
ok('calcPerquisite: chauffeur add-on is a flat 3000, independent of engine size',
  calcPerquisite(false, true) - calcPerquisite(false, false) === 3000 &&
  calcPerquisite(true, true) - calcPerquisite(true, false) === 3000);
ok('calcPerquisite: no pre-2026 value (1800/2400/900/2700/3300) is still returned',
  ![1800, 2400, 900, 2700, 3300].some(stale =>
    [calcPerquisite(false,false), calcPerquisite(true,false),
     calcPerquisite(false,true), calcPerquisite(true,true)].includes(stale)));

// calcCarDepreciation
ok('calcCarDepreciation: year 1 is exactly 80% of price', calcCarDepreciation(1000000, 1) === 1000000 * 0.80);
ok('calcCarDepreciation: year 2 is exactly 80%*85% of price', approxEqual(calcCarDepreciation(1000000, 2), 1000000 * 0.80 * 0.85, 0.0001));
ok('calcCarDepreciation: monotonically decreasing in years', calcCarDepreciation(1000000, 1) > calcCarDepreciation(1000000, 3) && calcCarDepreciation(1000000, 3) > calcCarDepreciation(1000000, 5));
ok('calcCarDepreciation: zero price -> zero resale', calcCarDepreciation(0, 5) === 0);

// CAR_RUNNING_DEFAULTS / splitAnnualKm / evEfficiencyFromRange (S8, 2026-09-25)
{
  ok('CAR_RUNNING_DEFAULTS: pins the frozen constants',
    CAR_RUNNING_DEFAULTS.cityShare === 2 / 3 &&
    CAR_RUNNING_DEFAULTS.iceHwyMult === 1.35 && CAR_RUNNING_DEFAULTS.evHwyMult === 1.15 &&
    CAR_RUNNING_DEFAULTS.publicRate === 20 &&
    CAR_RUNNING_DEFAULTS.iceMaint === 9000 && CAR_RUNNING_DEFAULTS.evMaint === 4500 &&
    CAR_RUNNING_DEFAULTS.iceIns === 0.030 && CAR_RUNNING_DEFAULTS.evIns === 0.038 &&
    CAR_RUNNING_DEFAULTS.depRate === 0.15);
  const split = splitAnnualKm(12000);
  ok('splitAnnualKm: 12000 -> 8000/4000', approxEqual(split.cityKm, 8000, 0.01) && approxEqual(split.hwyKm, 4000, 0.01));
  ok('splitAnnualKm: conserves the sum', approxEqual(split.cityKm + split.hwyKm, 12000, 0.01));
  ok('splitAnnualKm: 0/negative/NaN -> zeros',
    splitAnnualKm(0).cityKm === 0 && splitAnnualKm(-500).cityKm === 0 && splitAnnualKm(NaN).cityKm === 0);
  ok('evEfficiencyFromRange: (400,40) === 10', evEfficiencyFromRange(400, 40) === 10);
  ok('evEfficiencyFromRange: (0,40) === 0 and (400,0) === 0', evEfficiencyFromRange(0, 40) === 0 && evEfficiencyFromRange(400, 0) === 0);
  const oldExplicit = { cityKm: 8000, hwyKm: 4000, petrolPrice: 117, iceHwyMult: 1.35, homeRate: 8, publicRate: 20, evHwyMult: 1.15 };
  const newDerived = { cityKm: split.cityKm, hwyKm: split.hwyKm, petrolPrice: 117, iceHwyMult: CAR_RUNNING_DEFAULTS.iceHwyMult, homeRate: 8, publicRate: CAR_RUNNING_DEFAULTS.publicRate, evHwyMult: CAR_RUNNING_DEFAULTS.evHwyMult };
  ok('calcRunningCost: splitAnnualKm(12000)+CAR_RUNNING_DEFAULTS matches the old explicit object',
    approxEqual(calcRunningCost('ICE', 15, oldExplicit).annual, calcRunningCost('ICE', 15, newDerived).annual, 0.01));
}

// calcLeaseMarginalRate rebateBoost (S1/S2, 2026-09-25)
{
  const boost130k = calcLeaseMarginalRate(1500000, 10, 0.10, 4, false, false, 1560000, 'new', 0);
  const boost140k = calcLeaseMarginalRate(1500000, 10, 0.10, 4, false, false, 1680000, 'new', 0);
  const boost100k = calcLeaseMarginalRate(1500000, 10, 0.10, 4, false, false, 1200000, 'new', 0);
  const boost200k = calcLeaseMarginalRate(1500000, 10, 0.10, 4, false, false, 2400000, 'new', 0);
  const boost130kOld = calcLeaseMarginalRate(1500000, 10, 0.10, 4, false, false, 1560000, 'old', 0);
  ok('calcLeaseMarginalRate: rebateBoost true at ₹1.3L/mo and ₹1.4L/mo (new regime)',
    boost130k.rebateBoost === true && boost140k.rebateBoost === true);
  ok('calcLeaseMarginalRate: rebateBoost false at ₹1L/mo and ₹2L/mo (new regime), and on old regime',
    boost100k.rebateBoost === false && boost200k.rebateBoost === false && boost130kOld.rebateBoost === false);
}

// calcOwnershipCost / calcOwnershipCurve (Phase 13's R49, generalised across
// lease/loan/cash by Phase 14/R55) — mirrors tests.js's block. Reference
// case (₹20L ICE, 10% residual, 10% rate, 4yr, app defaults): endpoint
// 2406795.0641, gap 1424195.0641.
{
  const base = {
    mode: 'lease',
    price: 2000000, annualRate: 10, residualPct: 0.10, years: 4,
    hasDriver: false, marginalRate: 0.312, bigEngine: false,
    type: 'ICE', efficiency: 15,
    cityKm: 8000, hwyKm: 4000, petrolPrice: 117, iceHwyMult: 1.35,
    homeRate: 8, publicRate: 20, evHwyMult: 1.15,
    maintAnnual: 9000, insRate: 0.03, depRate: 0.15,
  };
  const curve = calcOwnershipCurve(base);
  const net = calcOwnershipCost(base);
  const last = curve.years.length - 1;

  ok('calcOwnershipCurve: reference case endpoint pins to 2406795.0641', approxEqual(curve.cumulativeCost[last], 2406795.0641, 0.01), `got ${curve.cumulativeCost[last].toFixed(4)}`);
  ok('calcOwnershipCurve: reference case gap pins to 1424195.0641', approxEqual(curve.cumulativeCost[last] - curve.carValue[last], 1424195.0641, 0.01), `got ${(curve.cumulativeCost[last] - curve.carValue[last]).toFixed(4)}`);
  ok("calcOwnershipCurve: cumulativeCost[N-1] === calcOwnershipCost netCost", approxEqual(curve.cumulativeCost[last], net.netCost, 0.01), `curve=${curve.cumulativeCost[last].toFixed(4)} netCost=${net.netCost.toFixed(4)}`);
  ok("calcOwnershipCurve: cumulativeCost[N-1] - carValue[N-1] === netCostAfterResale", approxEqual(curve.cumulativeCost[last] - curve.carValue[last], net.netCostAfterResale, 0.01), `gap=${(curve.cumulativeCost[last]-curve.carValue[last]).toFixed(4)} netCostAfterResale=${net.netCostAfterResale.toFixed(4)}`);

  // Guards against the EMI being recomputed per-year at a shorter tenure
  // instead of accumulated at the full-term value — invisible at the
  // endpoint, so pinned at an intermediate year instead.
  ok('calcOwnershipCurve: year-2 point is the full-term EMI accumulated, not a 2-year lease repriced', approxEqual(curve.cumulativeCost[1], 1118798.7828, 0.01), `got ${curve.cumulativeCost[1].toFixed(4)}`);
  const repricedYear2 = calcOwnershipCost({ ...base, years: 2 }).netCost;
  ok('calcOwnershipCurve: year-2 point must NOT equal a 2-year-tenure calcOwnershipCost', !approxEqual(curve.cumulativeCost[1], repricedYear2, 0.01), `curve[1]=${curve.cumulativeCost[1].toFixed(4)} 2yr-repriced=${repricedYear2.toFixed(4)}`);

  let costRising = true, valueFalling = true;
  for (let i = 1; i < curve.years.length; i++) {
    if (curve.cumulativeCost[i] <= curve.cumulativeCost[i-1]) costRising = false;
    if (curve.carValue[i] >= curve.carValue[i-1]) valueFalling = false;
  }
  ok('calcOwnershipCurve: cumulativeCost is strictly rising year over year', costRising, `values=${curve.cumulativeCost.map(v=>v.toFixed(0))}`);
  ok('calcOwnershipCurve: carValue is strictly falling year over year', valueFalling, `values=${curve.carValue.map(v=>v.toFixed(0))}`);

  const single = calcOwnershipCurve({ ...base, years: 1 });
  const singleNet = calcOwnershipCost({ ...base, years: 1 });
  ok('calcOwnershipCurve: N=1 produces exactly one point', single.years.length === 1 && single.cumulativeCost.length === 1 && single.carValue.length === 1, `years.length=${single.years.length}`);
  ok('calcOwnershipCurve: N=1 endpoint still matches calcOwnershipCost at the same tenure', approxEqual(single.cumulativeCost[0], singleNet.netCost, 0.01), `curve=${single.cumulativeCost[0].toFixed(4)} netCost=${singleNet.netCost.toFixed(4)}`);
  ok('calcOwnershipCurve: N=1 values are finite (no NaN/Infinity)', isFinite(single.cumulativeCost[0]) && isFinite(single.carValue[0]));

  const zeroRate = calcOwnershipCurve({ ...base, annualRate: 0 });
  const zeroRateNet = calcOwnershipCost({ ...base, annualRate: 0 });
  ok('calcOwnershipCurve: zero-rate case is finite throughout', zeroRate.cumulativeCost.every(isFinite) && zeroRate.carValue.every(isFinite), `cumulativeCost=${zeroRate.cumulativeCost}`);
  ok('calcOwnershipCurve: zero-rate case endpoint still matches calcOwnershipCost', approxEqual(zeroRate.cumulativeCost[zeroRate.years.length-1], zeroRateNet.netCost, 0.01), `curve=${zeroRate.cumulativeCost[zeroRate.years.length-1].toFixed(4)} netCost=${zeroRateNet.netCost.toFixed(4)}`);

  // ── Loan/cash modes (Phase 14, R55) ──────────────────────────────────
  const loanBase = { ...base, mode: 'loan', downPayment: 300000 };
  const loanCurve = calcOwnershipCurve(loanBase);
  const loanNet = calcOwnershipCost(loanBase);
  ok('calcOwnershipCurve (loan mode): endpoint equals calcOwnershipCost netCost', approxEqual(loanCurve.cumulativeCost[loanCurve.years.length - 1], loanNet.netCost, 0.01), `curve=${loanCurve.cumulativeCost[loanCurve.years.length-1].toFixed(4)} netCost=${loanNet.netCost.toFixed(4)}`);
  ok('calcOwnershipCurve (loan mode): year-2 point is the full-term EMI accumulated, not a 2-year loan repriced', approxEqual(loanCurve.cumulativeCost[1], 1634815.6264, 0.01), `got ${loanCurve.cumulativeCost[1].toFixed(4)}`);
  const loanRepricedYear2 = calcOwnershipCost({ ...loanBase, years: 2 }).netCost;
  ok('calcOwnershipCurve (loan mode): year-2 point must NOT equal a 2-year-tenure calcOwnershipCost', !approxEqual(loanCurve.cumulativeCost[1], loanRepricedYear2, 0.01), `curve[1]=${loanCurve.cumulativeCost[1].toFixed(4)} 2yr-repriced=${loanRepricedYear2.toFixed(4)}`);

  const cashBase = { ...base, mode: 'cash' };
  const cashCurve = calcOwnershipCurve(cashBase);
  const cashNet = calcOwnershipCost(cashBase);
  ok('calcOwnershipCurve (cash mode): endpoint equals calcOwnershipCost netCost', approxEqual(cashCurve.cumulativeCost[cashCurve.years.length - 1], cashNet.netCost, 0.01), `curve=${cashCurve.cumulativeCost[cashCurve.years.length-1].toFixed(4)} netCost=${cashNet.netCost.toFixed(4)}`);

  const leaseZeroResidual = calcOwnershipCost({ ...base, mode: 'lease', residualPct: 0 });
  const loanZeroDown = calcOwnershipCost({ ...base, mode: 'loan', downPayment: 0 });
  ok('calcOwnershipCost: residual=0 lease and downPayment=0 loan produce IDENTICAL EMIs', leaseZeroResidual.emi === loanZeroDown.emi, `lease=${leaseZeroResidual.emi} loan=${loanZeroDown.emi}`);

  ok('calcLumpsumGrowth: matches P*(1+cagr/100)^years', approxEqual(calcLumpsumGrowth(1000000, 12, 5), 1000000 * Math.pow(1.12, 5), 0.01), `got ${calcLumpsumGrowth(1000000, 12, 5)}`);
}

// calcNetWorthProjection (Phase 16/R65) — extracted verbatim out of
// renderWorthProjection()'s inline closure so that function and the loan
// panel's reverse Worth bridge (renderAdvWorthBridge()) call one shared
// formula instead of two hand-copied ones.
{
  ok('calcNetWorthProjection: all-zero inputs at year 0 -> 0',
    calcNetWorthProjection(0, 0, 0, 10, 9, 10, 0, 0) === 0,
    `got ${calcNetWorthProjection(0, 0, 0, 10, 9, 10, 0, 0)}`);

  ok('calcNetWorthProjection: year 0 with no SIP contribution reduces to investable + property - liabilities exactly',
    calcNetWorthProjection(100000, 500000, 200000, 10, 9, 10, 0, 0) === 400000,
    `got ${calcNetWorthProjection(100000, 500000, 200000, 10, 9, 10, 0, 0)}`);

  const investable = 100000, propertyVal = 0, liabilities = 120000;
  const monthlySip = 10000, years = 5, debtYears = 10;
  const expected = investable
    + calcSIP(monthlySip, 0, years)
    + propertyVal
    - loanAtYear(liabilities, 0, debtYears, years).balance;
  ok('calcNetWorthProjection: 0% cagr/0% debt-rate case matches calcSIP + loanAtYear composed independently',
    calcNetWorthProjection(investable, propertyVal, liabilities, 0, 0, debtYears, monthlySip, years) === expected,
    `got ${calcNetWorthProjection(investable, propertyVal, liabilities, 0, 0, debtYears, monthlySip, years)} expected ${expected}`);

  ok('calcNetWorthProjection: property is held flat — with investable/liabilities/SIP all 0, the result equals propertyVal unchanged at any horizon',
    calcNetWorthProjection(0, 750000, 0, 12, 9, 10, 0, 20) === 750000,
    `got ${calcNetWorthProjection(0, 750000, 0, 12, 9, 10, 0, 20)}`);

  const debtPaidResult = calcNetWorthProjection(200000, 0, 500000, 10, 9, 5, 0, 5);
  const expectedGrown = 200000 * Math.pow(1.10, 5);
  ok('calcNetWorthProjection: debt fully paid off by the horizon leaves only the grown investable amount (no negative liability)',
    approxEqual(debtPaidResult, expectedGrown, 0.01),
    `got ${debtPaidResult} expected ${expectedGrown}`);
}

// calcOnRoadCost / CAR_STATE_CHARGES (Wave 0, CR1, 2026-09-29) — mirrors
// the same assertions as tests.js's block of the same name.
{
  const tgLow = calcOnRoadCost({ exShowroom: 400000, stateCode: 'TG', fuel: 'petrol' });
  ok('calcOnRoadCost (TG petrol, below first slab): 13% road tax',
    tgLow.roadTaxPct === 13 && approxEqual(tgLow.roadTax, 52000, 0.01), JSON.stringify(tgLow));

  const tgBoundary = calcOnRoadCost({ exShowroom: 500000, stateCode: 'TG', fuel: 'diesel' });
  ok('calcOnRoadCost (TG, exactly AT the 500000 slab boundary): rolls into the HIGHER 14% band (exclusive upper bound)',
    tgBoundary.roadTaxPct === 14, `got ${tgBoundary.roadTaxPct}`);

  const tgOverBoundary = calcOnRoadCost({ exShowroom: 500001, stateCode: 'TG', fuel: 'petrol' });
  ok('calcOnRoadCost (TG, one rupee over the boundary): stays in the 14% band',
    tgOverBoundary.roadTaxPct === 14, `got ${tgOverBoundary.roadTaxPct}`);

  const dlBoundary = calcOnRoadCost({ exShowroom: 600000, stateCode: 'DL', fuel: 'petrol' });
  ok('calcOnRoadCost (DL, exactly AT the 600000 slab boundary): rolls into the higher 7% band, not the 4% one',
    dlBoundary.roadTaxPct === 7, `got ${dlBoundary.roadTaxPct}`);

  const tgDiesel = calcOnRoadCost({ exShowroom: 400000, stateCode: 'TG', fuel: 'diesel' });
  const tgCng = calcOnRoadCost({ exShowroom: 400000, stateCode: 'TG', fuel: 'cng' });
  ok('calcOnRoadCost (TG): fuelUniform state prices petrol/diesel/CNG identically at the same price',
    tgLow.roadTaxPct === tgDiesel.roadTaxPct && tgDiesel.roadTaxPct === tgCng.roadTaxPct,
    `petrol=${tgLow.roadTaxPct} diesel=${tgDiesel.roadTaxPct} cng=${tgCng.roadTaxPct}`);

  const kaBasePct = 14; // resolveSlabPct(KA.slabs, 800000) — the source's own "₹8L -> 14% band" example
  const kaPetrol = calcOnRoadCost({ exShowroom: 800000, stateCode: 'KA', fuel: 'petrol' });
  const kaDiesel = calcOnRoadCost({ exShowroom: 800000, stateCode: 'KA', fuel: 'diesel' });
  ok('calcOnRoadCost (KA petrol): base slab x taxCessMultiplier',
    approxEqual(kaPetrol.roadTaxPct, kaBasePct * CAR_STATE_CHARGES.KA.taxCessMultiplier, 1e-9),
    `expected ${kaBasePct * CAR_STATE_CHARGES.KA.taxCessMultiplier} got ${kaPetrol.roadTaxPct}`);
  ok('calcOnRoadCost (KA diesel): (base slab + dieselSurchargePct) x taxCessMultiplier',
    approxEqual(kaDiesel.roadTaxPct, (kaBasePct + CAR_STATE_CHARGES.KA.dieselSurchargePct) * CAR_STATE_CHARGES.KA.taxCessMultiplier, 1e-9),
    `expected ${(kaBasePct + CAR_STATE_CHARGES.KA.dieselSurchargePct) * CAR_STATE_CHARGES.KA.taxCessMultiplier} got ${kaDiesel.roadTaxPct}`);

  const kaEv = calcOnRoadCost({ exShowroom: 1200000, stateCode: 'KA', fuel: 'ev' });
  ok('calcOnRoadCost (KA EV, not exempt post-2026-04-01): priced off its own EV slab table (8%), NOT the ICE slab x cess',
    kaEv.roadTaxPct === 8 && kaEv.roadTax > 0 && !!kaEv.roadTaxReason, JSON.stringify(kaEv));

  const dlPetrol800 = calcOnRoadCost({ exShowroom: 800000, stateCode: 'DL', fuel: 'petrol' });
  const dlDiesel800 = calcOnRoadCost({ exShowroom: 800000, stateCode: 'DL', fuel: 'diesel' });
  ok('calcOnRoadCost (DL): diesel pct === petrol pct x dieselMultiplier (1.25)',
    approxEqual(dlDiesel800.roadTaxPct, dlPetrol800.roadTaxPct * CAR_STATE_CHARGES.DL.dieselMultiplier, 1e-9),
    `petrol=${dlPetrol800.roadTaxPct} diesel=${dlDiesel800.roadTaxPct}`);
  ok('calcOnRoadCost (DL diesel, ₹8L): matches the commonly-cited 8.75% figure exactly',
    dlDiesel800.roadTaxPct === 8.75, `got ${dlDiesel800.roadTaxPct}`);

  const tgEv = calcOnRoadCost({ exShowroom: 900000, stateCode: 'TG', fuel: 'ev' });
  ok('calcOnRoadCost (TG EV, exempt): zero road tax with a human-readable reason',
    tgEv.roadTax === 0 && tgEv.roadTaxPct === 0 && typeof tgEv.roadTaxReason === 'string' && tgEv.roadTaxReason.length > 0,
    JSON.stringify(tgEv));

  const dlEvUnderCap = calcOnRoadCost({ exShowroom: 2500000, stateCode: 'DL', fuel: 'ev' });
  ok('calcOnRoadCost (DL EV, under the ₹30L exemption cap): zero road tax',
    dlEvUnderCap.roadTax === 0 && !!dlEvUnderCap.roadTaxReason, JSON.stringify(dlEvUnderCap));

  const dlEvOverCap = calcOnRoadCost({ exShowroom: 3500000, stateCode: 'DL', fuel: 'ev' });
  ok('calcOnRoadCost (DL EV, over the ₹30L exemption cap): falls back to the normal EV/petrol-style slab, road tax > 0',
    dlEvOverCap.roadTax > 0 && dlEvOverCap.roadTaxPct === 10, `got pct=${dlEvOverCap.roadTaxPct} tax=${dlEvOverCap.roadTax}`);

  const gjEv = calcOnRoadCost({ exShowroom: 900000, stateCode: 'GJ', fuel: 'ev' });
  ok('calcOnRoadCost (GJ EV): lapsed concession means the standard 6% applies, not a 0/1% exemption',
    gjEv.roadTaxPct === 6 && gjEv.roadTax === 54000, JSON.stringify(gjEv));

  const other = calcOnRoadCost({ exShowroom: 500000, stateCode: 'ZZ', fuel: 'petrol' });
  ok('calcOnRoadCost (unknown state code): falls back to the OT default (10%), not a crash or NaN',
    other.roadTaxPct === CAR_STATE_CHARGES.OT.slabs[0][1] && other.roadTax === 50000, JSON.stringify(other));

  const overridden = calcOnRoadCost({ exShowroom: 500000, stateCode: 'TG', fuel: 'petrol', roadTaxPct: 5, regCharges: 9999, insurance: 1234 });
  ok('calcOnRoadCost: roadTaxPct/regCharges/insurance overrides are honoured exactly, and an override clears the "why" reason',
    overridden.roadTaxPct === 5 && overridden.roadTax === 25000 && overridden.regCharges === 9999 &&
    overridden.insurance === 1234 && overridden.roadTaxReason === null,
    JSON.stringify(overridden));

  ok('calcOnRoadCost: TCS does NOT apply at exactly the ₹10,00,000 threshold',
    calcOnRoadCost({ exShowroom: CAR_TCS_THRESHOLD, stateCode: 'TG', fuel: 'petrol' }).tcsApplies === false);
  ok('calcOnRoadCost: TCS DOES apply one rupee over the ₹10,00,000 threshold',
    calcOnRoadCost({ exShowroom: CAR_TCS_THRESHOLD + 1, stateCode: 'TG', fuel: 'petrol' }).tcsApplies === true);

  const tcsCar = calcOnRoadCost({ exShowroom: 1200000, stateCode: 'KA', fuel: 'ev' });
  ok('calcOnRoadCost: tcs amount is exactly CAR_TCS_RATE_PCT% of ex-showroom price when it applies',
    approxEqual(tcsCar.tcs, 1200000 * CAR_TCS_RATE_PCT / 100, 0.01), `got ${tcsCar.tcs}`);
  ok('calcOnRoadCost: onRoad === onRoadExTcs + tcs (TCS is cash paid, folded into the on-road total, but broken out as creditable)',
    approxEqual(tcsCar.onRoad, tcsCar.onRoadExTcs + tcsCar.tcs, 0.01), `onRoad=${tcsCar.onRoad} onRoadExTcs=${tcsCar.onRoadExTcs} tcs=${tcsCar.tcs}`);

  [tgLow, tgBoundary, tgOverBoundary, dlBoundary, kaPetrol, kaDiesel, kaEv, dlPetrol800, dlDiesel800,
   tgEv, dlEvUnderCap, dlEvOverCap, gjEv, other, overridden, tcsCar].forEach((r, i) => {
    ok(`calcOnRoadCost: onRoadExTcs === exShowroom + roadTax + regCharges + insurance (case #${i})`,
      approxEqual(r.onRoadExTcs, r.exShowroom + r.roadTax + r.regCharges + r.insurance, 0.01),
      `onRoadExTcs=${r.onRoadExTcs} sum=${r.exShowroom + r.roadTax + r.regCharges + r.insurance}`);
  });

  [0, -500000, NaN, undefined, Infinity].forEach(bad => {
    const r = calcOnRoadCost({ exShowroom: bad, stateCode: 'TG', fuel: 'petrol' });
    const isBadFinite = Number.isFinite(bad) && bad > 0;
    if (!isBadFinite) {
      ok(`calcOnRoadCost: non-finite/zero/negative exShowroom (${bad}) degrades to an all-zero result, never NaN`,
        r.onRoad === 0 && Object.values(r).every(v => v === null || v === false || Number.isFinite(v)),
        JSON.stringify(r));
    }
  });
  const blankFuel = calcOnRoadCost({ exShowroom: 400000, stateCode: 'TG', fuel: '' });
  ok('calcOnRoadCost: blank/unknown fuel falls back to petrol pricing, not NaN',
    blankFuel.roadTaxPct === 13 && Number.isFinite(blankFuel.onRoad), JSON.stringify(blankFuel));

  ok('calcOnRoadCost(): no argument at all does not throw, returns the all-zero result',
    calcOnRoadCost().onRoad === 0, JSON.stringify(calcOnRoadCost()));
  ok('calcOnRoadCost(undefined): explicit undefined does not throw, returns the all-zero result',
    calcOnRoadCost(undefined).onRoad === 0, JSON.stringify(calcOnRoadCost(undefined)));

  ok('CAR_REG_CHARGES_DEFAULT is pinned at ₹12,000 (as of 2026-09-29)', CAR_REG_CHARGES_DEFAULT === 12000);
  ok('CAR_TCS_RATE_PCT is pinned at 1% (Income-tax Act 2025, s.394(1) Sl.No.6, as of 2026-09-29)', CAR_TCS_RATE_PCT === 1);
  ok('CAR_TCS_THRESHOLD is pinned at ₹10,00,000', CAR_TCS_THRESHOLD === 1000000);
}

// =====================================================================
// calcCarBuyLoan / calcLoanVsCash / isLoanVsCashEven / calcLoanUnderwater
// (Wave 2, CR5–CR7, 2026-10-01) — "Buy a car" tile's EMI, loan-vs-cash and
// underwater cards. All reuse calcEMI / loanAtYear / calcCarDepreciation.
// =====================================================================
{
  const ex = 1000000;
  const onRoad = calcOnRoadCost({ exShowroom: ex, stateCode: 'TG', fuel: 'petrol' }).onRoad;
  const down = onRoad * 0.2;
  const L = onRoad - down;

  // ── calcCarBuyLoan ──
  const b = calcCarBuyLoan({ onRoad, downPayment: down, annualRate: 9, years: 5 });
  ok('calcCarBuyLoan (default example): loanAmount = onRoad - 20% down', approxEqual(b.loanAmount, L, 1e-6), JSON.stringify(b));
  ok('calcCarBuyLoan: emi equals calcEMI exactly', b.emi === calcEMI(b.loanAmount, 9, 5));
  ok('calcCarBuyLoan: totalInterest matches loanAtYear interestPaid',
    approxEqual(b.totalInterest, loanAtYear(b.loanAmount, 9, 5, 5).interestPaid, 1e-6));
  ok('calcCarBuyLoan: totalPaid = down + emi*60', approxEqual(b.totalPaid, down + b.emi * 60, 1e-6));
  ok('calcCarBuyLoan: months = 60', b.months === 60);

  const z = calcCarBuyLoan({ onRoad, downPayment: down, annualRate: 0, years: 5 });
  ok('calcCarBuyLoan (0% rate): emi = L/60', approxEqual(z.emi, L / 60, 1e-9), JSON.stringify(z));
  ok('calcCarBuyLoan (0% rate): totalInterest is 0', z.totalInterest === 0);

  const full = calcCarBuyLoan({ onRoad, downPayment: onRoad, annualRate: 9, years: 5 });
  ok('calcCarBuyLoan (100% down): loanAmount 0, emi 0, totalPaid = onRoad',
    full.loanAmount === 0 && full.emi === 0 && full.totalPaid === onRoad, JSON.stringify(full));
  const over = calcCarBuyLoan({ onRoad, downPayment: onRoad * 2, annualRate: 9, years: 5 });
  ok('calcCarBuyLoan: down payment above onRoad clamps to onRoad', over.downPayment === onRoad && over.loanAmount === 0);
  const negDown = calcCarBuyLoan({ onRoad, downPayment: -5000, annualRate: 9, years: 5 });
  ok('calcCarBuyLoan: negative down payment clamps to 0', negDown.downPayment === 0 && negDown.loanAmount === onRoad);

  const ov = calcCarBuyLoan({ onRoad, downPayment: 1, loanAmount: 500000, annualRate: 9, years: 5 });
  ok('calcCarBuyLoan: loanAmount override wins; down payment becomes the remainder',
    ov.loanAmount === 500000 && approxEqual(ov.downPayment, onRoad - 500000, 1e-6));
  const ovBig = calcCarBuyLoan({ onRoad, loanAmount: onRoad * 3, annualRate: 9, years: 5 });
  ok('calcCarBuyLoan: loanAmount override above onRoad clamps to onRoad', ovBig.loanAmount === onRoad && ovBig.downPayment === 0);
  const ovZero = calcCarBuyLoan({ onRoad, downPayment: 100000, loanAmount: 0, annualRate: 9, years: 5 });
  ok('calcCarBuyLoan: loanAmount override of 0 means no loan (not "blank")',
    ovZero.loanAmount === 0 && ovZero.downPayment === onRoad && ovZero.emi === 0);

  const y0 = calcCarBuyLoan({ onRoad, downPayment: down, annualRate: 9, years: 0 });
  ok('calcCarBuyLoan (years 0): emi 0, totalPaid = onRoad, no interest',
    y0.emi === 0 && y0.totalPaid === onRoad && y0.totalInterest === 0, JSON.stringify(y0));

  const junk = [undefined, null, NaN, Infinity, -1, 'x'];
  for (const j of junk) {
    const r = calcCarBuyLoan({ onRoad: j, downPayment: j, annualRate: j, years: j, loanAmount: j });
    ok(`calcCarBuyLoan: junk inputs (${String(j)}) give finite numbers`,
      Object.values(r).every(Number.isFinite), JSON.stringify(r));
  }
  ok('calcCarBuyLoan(): no argument does not throw and is all finite', Object.values(calcCarBuyLoan()).every(Number.isFinite));
  ok('calcCarBuyLoan: negative rate treated as 0%', calcCarBuyLoan({ onRoad, downPayment: down, annualRate: -3, years: 5 }).totalInterest === 0);

  // ── calcLoanVsCash ──
  for (const rate of [9, 12]) {
    for (const yrs of [1, 3, 5, 7]) {
      const r = calcLoanVsCash({ loanAmount: L, annualRate: rate, years: yrs, expectedReturn: rate });
      ok(`calcLoanVsCash: return === loan rate (${rate}%, ${yrs}y) -> gap ~ 0 (annuity identity)`,
        r.applies && Math.abs(r.gap) < 1e-6 * L, `gap=${r.gap}`);
    }
  }
  ok('calcLoanVsCash: higher return than the loan rate -> gap > 0',
    calcLoanVsCash({ loanAmount: L, annualRate: 9, years: 5, expectedReturn: 12 }).gap > 0);
  ok('calcLoanVsCash: lower return than the loan rate -> gap < 0',
    calcLoanVsCash({ loanAmount: L, annualRate: 9, years: 5, expectedReturn: 6 }).gap < 0);
  const zz = calcLoanVsCash({ loanAmount: L, annualRate: 0, years: 5, expectedReturn: 0 });
  ok('calcLoanVsCash: 0% loan and 0% return -> gap 0', zz.applies && Math.abs(zz.gap) < 1e-6, JSON.stringify(zz));
  const r0 = calcLoanVsCash({ loanAmount: L, annualRate: 9, years: 5, expectedReturn: 0 });
  ok('calcLoanVsCash: cashPathValue at 0% return is emi*n', approxEqual(r0.cashPathValue, r0.emi * 60, 1e-6));
  ok('calcLoanVsCash: loanPathValue at 0% return is L', approxEqual(r0.loanPathValue, L, 1e-6));
  const neg = calcLoanVsCash({ loanAmount: L, annualRate: 9, years: 5, expectedReturn: -5 });
  ok('calcLoanVsCash: negative return is treated as 0%', neg.gap === r0.gap);
  const def = calcLoanVsCash({ loanAmount: L, annualRate: 9, years: 5, expectedReturn: 12 });
  ok('calcLoanVsCash: emi equals calcEMI; totalInterest matches calcCarBuyLoan',
    def.emi === calcEMI(L, 9, 5) && approxEqual(def.totalInterest, b.totalInterest, 1e-6));
  ok('calcLoanVsCash: loanPathValue = L*(1+0.12/12)^60', approxEqual(def.loanPathValue, L * Math.pow(1.01, 60), 1e-6));
  const zeroApply = { applies: false, emi: 0, months: 0, loanPathValue: 0, cashPathValue: 0, gap: 0, totalInterest: 0 };
  for (const bad of [{ loanAmount: 0, years: 5 }, { loanAmount: -1, years: 5 }, { loanAmount: NaN, years: 5 },
                     { loanAmount: L, years: 0 }, { loanAmount: L, years: NaN }, { loanAmount: L, years: 0.5 }, undefined]) {
    const r = calcLoanVsCash(bad && Object.assign({ annualRate: 9, expectedReturn: 12 }, bad));
    ok(`calcLoanVsCash: non-applicable input ${JSON.stringify(bad)} -> applies:false, all zeros`,
      JSON.stringify(r) === JSON.stringify(zeroApply), JSON.stringify(r));
  }
  ok('calcLoanVsCash: non-finite expectedReturn treated as 0, result finite',
    Object.values(calcLoanVsCash({ loanAmount: L, annualRate: 9, years: 5, expectedReturn: NaN })).every(v => typeof v === 'boolean' || Number.isFinite(v)));

  // ── isLoanVsCashEven: max(1000, 0.5% of L) pinned ──
  ok('isLoanVsCashEven: small loan -> ₹1,000 floor, just inside', isLoanVsCashEven(999, 100000) === true);
  ok('isLoanVsCashEven: small loan -> ₹1,000 floor, at the boundary is NOT even', isLoanVsCashEven(1000, 100000) === false);
  ok('isLoanVsCashEven: negative gap uses the absolute value', isLoanVsCashEven(-999, 100000) === true && isLoanVsCashEven(-1000, 100000) === false);
  ok('isLoanVsCashEven: large loan -> 0.5% of L (₹5,000 on ₹10L), just inside', isLoanVsCashEven(4999, 1000000) === true);
  ok('isLoanVsCashEven: large loan -> 0.5% of L, at the boundary is NOT even', isLoanVsCashEven(5000, 1000000) === false);
  ok('isLoanVsCashEven: the larger of the two applies (₹2L loan: floor 1000 beats 0.5% = 1000 tie)', isLoanVsCashEven(999.99, 200000) === true && isLoanVsCashEven(1000, 200000) === false);
  ok('isLoanVsCashEven: junk gap/loan does not throw', typeof isLoanVsCashEven(NaN, undefined) === 'boolean');

  // ── calcLoanUnderwater ──
  const u = calcLoanUnderwater({ loanAmount: L, annualRate: 9, years: 5, carValueBase: ex });
  ok('calcLoanUnderwater: all arrays have length = years',
    [u.years, u.balance, u.value, u.underwater].every(a => a.length === 5) && u.years.join() === '1,2,3,4,5');
  ok('calcLoanUnderwater: balance matches loanAtYear, value matches calcCarDepreciation (every year)',
    u.years.every((y, i) => u.balance[i] === loanAtYear(L, 9, 5, y).balance && u.value[i] === calcCarDepreciation(ex, y)));
  ok('calcLoanUnderwater: final-year balance is 0 and never underwater', u.balance[4] === 0 && u.underwater[4] === false);
  ok('calcLoanUnderwater (default example, ₹9.70 L loan on a ₹10 L car): underwater in year 1 only',
    JSON.stringify(u.ranges) === '[{"from":1,"to":1}]', JSON.stringify(u.ranges));
  const hi = calcLoanUnderwater({ loanAmount: 1.2 * ex, annualRate: 9, years: 5, carValueBase: ex });
  ok('calcLoanUnderwater (loan = 1.2x ex-showroom): range starts year 1 and ends before the final year',
    hi.ranges.length === 1 && hi.ranges[0].from === 1 && hi.ranges[0].to < 5, JSON.stringify(hi.ranges));
  ok('calcLoanUnderwater: ranges agree with the per-year flags',
    hi.underwater.every((f, i) => f === (hi.balance[i] > hi.value[i])) &&
    hi.underwater.slice(0, hi.ranges[0].to).every(Boolean) && !hi.underwater[hi.ranges[0].to]);
  const small = calcLoanUnderwater({ loanAmount: 0.5 * ex, annualRate: 9, years: 5, carValueBase: ex });
  ok('calcLoanUnderwater: a big down payment (loan 0.5x price) -> ranges []', small.ranges.length === 0 && small.underwater.every(f => !f));
  // Constructed: 0% rate, L = 1.2x, 5y. balance_y = 1.2*ex*(1 - y/5); value = ex*0.8*0.85^(y-1).
  const c0 = calcLoanUnderwater({ loanAmount: 1.2 * ex, annualRate: 0, years: 5, carValueBase: ex });
  ok('calcLoanUnderwater (0% rate, L=1.2x): constructed range is exactly years 1-2',
    JSON.stringify(c0.ranges) === '[{"from":1,"to":2}]', JSON.stringify(c0.ranges));
  // Constructed: single-year 1y loan -> balance 0 at year 1, never underwater
  const one = calcLoanUnderwater({ loanAmount: ex, annualRate: 9, years: 1, carValueBase: ex });
  ok('calcLoanUnderwater (1-year loan): one entry, balance 0, ranges []', one.years.length === 1 && one.balance[0] === 0 && one.ranges.length === 0);
  // Constructed multi-run: a stub-free check that two separate runs are reported separately is
  // not reachable with a monotone balance vs. a monotone value, so assert maximal-run grouping instead.
  const long = calcLoanUnderwater({ loanAmount: 1.5 * ex, annualRate: 9, years: 7, carValueBase: ex });
  ok('calcLoanUnderwater: ranges are maximal contiguous runs (each flagged year is in exactly one range)',
    long.underwater.every((f, i) => f === long.ranges.some(r => i + 1 >= r.from && i + 1 <= r.to)) &&
    long.ranges.every((r, i) => i === 0 || r.from > long.ranges[i - 1].to + 1));
  const emptyU = { years: [], balance: [], value: [], underwater: [], ranges: [] };
  for (const bad of [{ loanAmount: 0 }, { loanAmount: -5 }, { loanAmount: NaN }, { years: 0 }, { years: NaN }, { carValueBase: 0 }, { carValueBase: NaN }, { carValueBase: -1 }]) {
    const r = calcLoanUnderwater(Object.assign({ loanAmount: L, annualRate: 9, years: 5, carValueBase: ex }, bad));
    ok(`calcLoanUnderwater: invalid input ${JSON.stringify(bad)} -> empty arrays`, JSON.stringify(r) === JSON.stringify(emptyU));
  }
  ok('calcLoanUnderwater(): no argument does not throw, returns empty arrays', JSON.stringify(calcLoanUnderwater()) === JSON.stringify(emptyU));
}

// Render
const summaryEl = document.getElementById('summary');
const resultsEl = document.getElementById('results');
summaryEl.textContent = `${pass} passed, ${fail} failed (${pass + fail} total)`;
summaryEl.className = 'summary ' + (fail === 0 ? 'pass' : 'fail');
resultsEl.innerHTML = rows.map(r =>
  `<div class="row ${r.condition ? 'ok' : 'bad'}">${r.condition ? '✓' : '✗'} ${r.name}${r.detail ? `<div class="detail">${r.detail}</div>` : ''}</div>`
).join('');
</script>
